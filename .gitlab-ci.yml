image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11

stages:
  - test
  - build
  - publish

lint-and-pytest:
  stage: test
  script:
    - export UV_PYTHON="3.13"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - opsi-dev-cli self upgrade
    - uv sync --frozen
    - uv run ruff check opsipxeconfd tests
    - uv run mypy opsipxeconfd tests
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport.xml --cov-config .coveragerc --cov opsipxeconfd --cov-report term --cov-report xml -v tests

build:linux-pyinstaller:
  stage: build
  script:
    - export UV_PYTHON="3.13"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - opsi-dev-cli self upgrade
    - uv run opsi-dev-cli -l info pyinstaller build
    - mv opsipxeconfd opsipxeconfd.src
    - mv dist/opsipxeconfd ./opsipxeconfd-amd64
    # Check if binary is working
    - ./opsipxeconfd-amd64/opsipxeconfd --version
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push opsipxeconfd-amd64 --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push opsipxeconfd-amd64'
  artifacts:
    name: "opsipxeconfd-linux-pyinstaller"
    paths:
      - opsipxeconfd-amd64
    expire_in: 2 day

build:arm64-pyinstaller:
  stage: build
  tags:
    - linux-arm64
  script:
    - export UV_PYTHON="3.13"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - opsi-dev-cli self upgrade
    - uv run opsi-dev-cli -l info pyinstaller build
    - mv dist/opsipxeconfd ./opsipxeconfd-arm64
    # Check if binary is working
    - ./opsipxeconfd-arm64/opsipxeconfd --version
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push opsipxeconfd-arm64 --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push opsipxeconfd-arm64'
  artifacts:
    name: "opsipxeconfd-arm64-pyinstaller"
    paths:
      - opsipxeconfd-arm64
    expire_in: 2 day

publish:obs_ext:
  stage: publish
  script:
    - opsi-dev-cli self upgrade
    - opsi-dev-cli -l info packaging obs --help
    - opsi-dev-cli -l info packaging obs update-package https://build.opensuse.org home:uibmz:opsi:4.3:development
    - opsi-dev-cli -l info changelog from-git output
    - opsi-dev-cli release-service register-package-version opsipxeconfd SERVER_PACKAGE --changelog-file output/changelog.md
    - opsi-dev-cli release-service push-repository-state opsipxeconfd SERVER_PACKAGE SERVER_PACKAGE-4.3-development
  only:
    - tags
