#
# These settings can be changes and persist through an update of opsi-linux-bootimage
#

# Timeout in the boot menu
# possible values: 0 to 10
# default value:   5
set timeout=5

# graphics mode
# The graphics mode causes problems with non-standard compliant hardware when booting the operating system.
# In these cases the graphics mode should be disabled ("false").
# possible values: "true", "false"
# default value:   "false"
set graphicsmode="true"

# The password hash for the user "root"
# possible values: The values are generated by command 1) and entered in this file by command 2).
# default value:   \$6\$wxfSngLk\$Ffkuanw5H6HhgQAATTQ/HjtlKdkktqcPImnieGFoaitIoBNqs1oMuLmmXouoe2Q6JVeQ85zHMOqZ5NzbfwajM0
# set pwh=\$6\$wxfSngLk\$Ffkuanw5H6HhgQAATTQ/HjtlKdkktqcPImnieGFoaitIoBNqs1oMuLmmXouoe2Q6JVeQ85zHMOqZ5NzbfwajM0
# test123: set pwh=\$6\$sZXTDzan\$6rJ2Wy2bs3O5TagGplmkU4eQWHhd.UzO/6cqdprdX6Tbv3QnIW3h/76pyulXLt/Pd6c/sYQULCHqc55em96BO0
set passwordhash=""

#
# language settings
# possible values: "de", "en", "fr", "it", "be", "da"
# default value: "en"
set language=""