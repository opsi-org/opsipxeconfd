        All rights reserved.
        License: {license}

pull-binaries:
  - name: grub-shim
    version: 16.1
    os: all
    architecture: x64
    extract: true
    destination: binaries
    server-type: binaryindex

  - name: grub-shim
    version: 16.1
    os: all
    architecture: arm64
    extract: true
    destination: binaries
    server-type: binaryindex

  - name: opsi-grub
    version: 2.12-66.1
    os: all
    architecture: x86
    extract: true
    destination: binaries
    server-type: binaryindex

  - name: opsi-grub
    version: 2.12-66.1
    os: all
    architecture: x64
    extract: true
    destination: binaries
    server-type: binaryindex

  - name: opsi-grub
    version: 2.12-66.1
    os: all
    architecture: arm64
    extract: true
    destination: binaries
    server-type: binaryindex

pyinstaller:
  one_file: no
  strip: yes
  scripts:
    - script: opsipxeconfd/__main__.py
      binaries:
        - opsipxeconfd
  data_files:
    - src: opsipxeconfd_data/**/*
      dst: opsipxeconfd_data
  dirname: opsipxeconfd
  after_script: |
    find dist/opsipxeconfd -iname "*.c" -delete
    find dist/opsipxeconfd -iname "*.h" -delete
    find dist/opsipxeconfd -iname "*.so" -exec chmod -x "{}" \;
    find dist/opsipxeconfd -iname "*.so.*" -exec chmod -x "{}" \;

package:
  name: opsipxeconfd
  type: binary
  conflicts:
    - opsi-linux-bootimage (<< 20250908)
  systemd: yes
  source_script: |
    mkdir -p ${DST}/rootfs/etc/opsi
    mkdir -p ${DST}/rootfs/tftpboot/opsi/loader
    mkdir -p ${DST}/rootfs/tftpboot/opsi/opsi-linux-bootimage/loader
    mkdir -p ${DST}/rootfs/usr/bin
    mkdir -p ${DST}/rootfs/usr/lib
    mkdir -p ${DST}/rootfs/usr/share/opsipxeconfd
    mkdir -p ${DST}/rootfs/var/log/opsi/opsipxeconfd

    mkdir -p ${DST}/systemd_units

    echo "#!/bin/sh"                                        > ${DST}/rootfs/usr/bin/opsipxeconfd
    echo "exec /usr/lib/opsipxeconfd/opsipxeconfd \"\$@\"" >> ${DST}/rootfs/usr/bin/opsipxeconfd
    chmod 755 ${DST}/rootfs/usr/bin/opsipxeconfd

    for arch in amd64 arm64; do
      arch_src="${SRC}/opsipxeconfd-${arch}"
      if [ ! -d "$arch_src" ]; then
        echo "Skipping $arch. No directory $arch_src found."
        continue
      fi
      arch_dst="${DST}/rootfs-${arch}"
      mkdir -p "${arch_dst}/usr/lib"
      cp -a "${arch_src}" "${arch_dst}/usr/lib/opsipxeconfd"
    done

    cp -a ${SRC}/opsipxeconfd_data/opsipxeconfd.service  ${DST}/systemd_units/
    cp -a ${SRC}/opsipxeconfd_data/opsipxeconfd.conf     ${DST}/rootfs/etc/opsi/
    cp -a ${SRC}/opsipxeconfd_data/grub.cfg              ${DST}/rootfs/usr/share/opsipxeconfd/

    cp ${SRC}/binaries/grub.x64/grub.x64.efi             ${DST}/rootfs/tftpboot/opsi/loader/grub.x64.efi
    cp ${SRC}/binaries/grub.x64/grub-debug.x64.efi       ${DST}/rootfs/tftpboot/opsi/loader/grub-debug.x64.efi
    cp ${SRC}/binaries/grub.arm64/grub.arm64.efi         ${DST}/rootfs/tftpboot/opsi/loader/grub.arm64.efi
    cp ${SRC}/binaries/grub.arm64/grub-debug.arm64.efi   ${DST}/rootfs/tftpboot/opsi/loader/grub-debug.arm64.efi
    cp ${SRC}/binaries/grub.x86/grub-pxe.x86.bios        ${DST}/rootfs/tftpboot/opsi/loader/grub.x86.bios
    cp ${SRC}/binaries/grub.x86/grub-pxe-debug.x86.bios  ${DST}/rootfs/tftpboot/opsi/loader/grub-debug.x86.bios

    cp ${SRC}/binaries/grub-shim.x64.efi       ${DST}/rootfs/tftpboot/opsi/loader/grub-shim.x64.efi
    cp ${SRC}/binaries/grub-shim.arm64.efi     ${DST}/rootfs/tftpboot/opsi/loader/grub-shim.arm64.efi

    # Create links for DHCP boot file names
    cd ${DST}/rootfs/tftpboot/opsi/loader
    ln -sf grub-shim.x64.efi   opsi-netboot.x64.efi
    ln -sf grub-shim.arm64.efi opsi-netboot.arm64.efi
    ln -sf grub.x86.bios       opsi-netboot.x86.bios

    # Create links for backward compatibility (old DHCP boot file names)
    cd ${DST}/rootfs/tftpboot/opsi/opsi-linux-bootimage/loader
    ln -s ../../loader/grub-shim.x64.efi  shimx64.efi.signed
    ln -s ../../loader/grub-shim.x64.efi  grub-shim.x64.efi
    ln -s ../../loader/grub.x64.efi       opsi-netboot.efi
    ln -s ../../loader/grub.x86.bios      opsi-netboot.bios

    # Some devices request /opsi-netboot.efi instead of /opsi/loader/opsi-netboot.efi when shim is loading opsi-netboot.efi
    cd ${DST}/rootfs/tftpboot
    ln -s opsi/loader/grub.x64.efi opsi-netboot.efi

  postinst_script: |
    # remove obsolete files
    [ -e /etc/logrotate.d/opsipxeconfd ] && rm /etc/logrotate.d/opsipxeconfd || true
    # Move log files to new default location
    mv /var/log/opsi/opsipxeconfd.log* /var/log/opsi/opsipxeconfd/ 2>/dev/null || true
